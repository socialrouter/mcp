name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  # sdk-bump.yml starts this one by hand on the tag it just pushed: a push made
  # with GITHUB_TOKEN does not trigger workflows.
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required for npm Trusted Publishing (OIDC) and provenance attestations.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Trusted Publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # Builds, then the hermetic unit suite.
      - name: Test
        run: npm test

      # Drift detector against the live catalogue. Public endpoint, no key.
      - name: Contract tests
        run: npm run test:contract

      - name: Publish
        run: npm publish --provenance --access public

      # Tell the hosted endpoint a new @socialrouter/mcp is on npm. Only after
      # the publish succeeded. It receives the version just published and the
      # SDK range this package was built against, so both of its dependencies
      # move together. The target repository comes from a secret, which keeps
      # its name masked in these public logs. Guarded on the secrets: a missing
      # one must not fail a publish that already went out.
      - name: Trigger the hosted endpoint
        if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        run: |
          if [ -z "${GH_TOKEN:-}" ] || [ -z "${TARGET_REPO:-}" ]; then
            echo "::warning::DOWNSTREAM_DISPATCH_TOKEN or MCP_REMOTE_REPO is not set — hosted endpoint not notified."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          sdk_range="$(node -p "require('./package.json').dependencies['@socialrouter/sdk']")"
          gh api "repos/$TARGET_REPO/dispatches" \
            -f event_type=mcp-published \
            -f "client_payload[version]=$version" \
            -f "client_payload[sdk_range]=$sdk_range"

